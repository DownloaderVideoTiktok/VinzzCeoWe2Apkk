name: Build telegram-bot-api binary

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job id dari panel (buat penamaan artifact)'
        required: false
        default: 'manual'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make git zlib1g-dev libssl-dev gperf cmake g++

      - name: Clone telegram-bot-api
        run: git clone --recursive https://github.com/tdlib/telegram-bot-api.git

      - name: Configure
        working-directory: telegram-bot-api
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Compile
        working-directory: telegram-bot-api/build
        run: cmake --build . --target install -j$(nproc)

      - name: Collect binary
        run: |
          mkdir -p out
          cp /usr/local/bin/telegram-bot-api out/telegram-bot-api
          chmod +x out/telegram-bot-api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-binary-${{ github.event.inputs.jobId }}
          path: out/telegram-bot-api
          retention-days: 3
